version: 0.2

env:
  parameter-store:
    GITHUB_TOKEN: ${gh_token}

phases:
  build:
    commands:
      - ACCT_ID=$(aws sts get-caller-identity --query "Account" --output text)
      - DOCKER_URI="$${ACCT_ID}.dkr.ecr.us-east-1.amazonaws.com"
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $${DOCKER_URI}
      - docker build -t $${DOCKER_URI}/$lambda_function_name . --build-arg GITHUB_TOKEN=$GITHUB_TOKEN
      - docker push $${DOCKER_URI}/$lambda_function_name
    # deploy the new image using the specific digest sha
      - DIGEST=$(aws ecr describe-images --repository-name $lambda_function_name --query 'sort_by(imageDetails,& imagePushedAt)[-1].imageDigest' --output text)
      - aws lambda update-function-code --function-name "$lambda_function_name" --image-uri $${DOCKER_URI}/$lambda_function_name@$DIGEST
